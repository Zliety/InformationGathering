name: Monthly run summary

on:
  schedule:
    # Every month on day 1 at 09:23 Asia/Shanghai (01:23 UTC).
    - cron: '23 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: monthly-run-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize last month's digest runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/monthly_run_summary.py
      - name: Commit monthly log
        run: |
          git add logs/monthly-runs.log
          if git diff --cached --quiet; then
            echo "Monthly log is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update monthly digest run statistics"
          git pull --rebase origin main
          git push origin HEAD:main
