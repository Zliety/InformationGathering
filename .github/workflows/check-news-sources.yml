name: Check news sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Website to check (no model calls or notifications)'
        type: choice
        options:
          - both
          - dahecube
          - sina_cj
        default: both

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install extraction dependencies
        run: python -m pip install -r requirements.txt
      - name: Check discovery and original article extraction
        env:
          SOURCE_ID: ${{ inputs.source }}
        run: python scripts/check_news_sources.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-source-check-${{ github.run_id }}
          path: source-check.md
          if-no-files-found: ignore
          retention-days: 7
