name: Daily news digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect articles and generate a preview without emailing or saving history'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: information-gathering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
      LLM_API_STYLE: ${{ vars.LLM_API_STYLE }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
      LLM_ARTICLE_TIMEOUT: ${{ vars.LLM_ARTICLE_TIMEOUT }}
      NEWS_PROMPT: ${{ vars.NEWS_PROMPT }}
      NEWSNOW_API_URL: ${{ vars.NEWSNOW_API_URL }}
      NEWS_SOURCES_PATH: ${{ vars.NEWS_SOURCES_PATH }}
      NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
      NEWS_MAX_ARTICLES: ${{ vars.NEWS_MAX_ARTICLES }}
      NEWS_MAX_MODEL_CALLS: ${{ vars.NEWS_MAX_MODEL_CALLS }}
      SOURCE_TIMEOUT: ${{ vars.SOURCE_TIMEOUT }}
      GMAIL_SMTP_HOST: ${{ vars.GMAIL_SMTP_HOST }}
      GMAIL_SMTP_PORT: ${{ vars.GMAIL_SMTP_PORT }}
      GMAIL_SMTP_SECURITY: ${{ vars.GMAIL_SMTP_SECURITY }}
      GMAIL_SMTP_USERNAME: ${{ secrets.GMAIL_SMTP_USERNAME }}
      GMAIL_SMTP_PASSWORD: ${{ secrets.GMAIL_SMTP_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      PUSH_CHANNELS: ${{ vars.PUSH_CHANNELS }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      MAIL_SUBJECT: ${{ vars.MAIL_SUBJECT }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore previous three reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_history.py
      - name: Collect, summarize, validate, and send
        id: digest
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python news_digest.py --dry-run
          else
            python news_digest.py
          fi
      - name: Persist report history
        if: success() && env.DRY_RUN != 'true' && steps.digest.outputs.report_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: information-gathering-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: .state/history.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload validated report preview
        if: success() && steps.digest.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: news-digest-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .state/report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
