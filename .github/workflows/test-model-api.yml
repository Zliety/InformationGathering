name: Test model API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
      LLM_API_STYLE: ${{ vars.LLM_API_STYLE }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ask a basic question without web search
        run: python scripts/test_llm_api.py
